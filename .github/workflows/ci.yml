name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - run: npm ci
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - run: npm run build
      - run: npm run check
      - run: npx vitest run
      - run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
      - run: go vet ${{ runner.os == 'Linux' && '-tags webkit2_41' || '' }} ./...
      - run: go test ${{ runner.os == 'Linux' && '-tags webkit2_41' || '' }} ./...
      - run: wails build -s -m -nosyncgomod ${{ runner.os == 'Linux' && '-tags webkit2_41' || '' }}
      - run: wails generate module && git diff --exit-code wailsjs/go

      - uses: actions/upload-artifact@v4
        with:
          name: rift-${{ matrix.os }}
          path: build/bin
